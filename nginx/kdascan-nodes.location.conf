# Include inside each kadena.ws / nodes.kadena.ws HTTPS server block.
# Browser clients cannot fetch kdascan directly: its API has no CORS header.
location = /api/kdascan/nodes {
    limit_except GET { deny all; }
    proxy_pass https://kdascan.dnns.es/api/nodos;
    proxy_set_header Host kdascan.dnns.es;
    proxy_ssl_server_name on;
    proxy_ssl_name kdascan.dnns.es;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    add_header Cache-Control "no-store" always;
}
