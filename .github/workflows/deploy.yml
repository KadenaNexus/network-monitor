name: deploy
# Shared workflow checks pull requests; only a main push updates the live destination.
on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:
jobs:
  site:
    uses: KadenaNexus/homepage/.github/workflows/deploy-static.yml@main
    with:
      source: client
      files: "index.html"
      target: /home/zero/monitor/dist/index.html
      file_target: true
      url: https://nodes.kadena.ws/
    secrets: inherit
