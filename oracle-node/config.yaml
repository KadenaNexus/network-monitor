databaseDirectory: /var/lib/chainweb
resetChainDatabases: false
chainweb:
  chainwebVersion: mainnet01
  fullHistoricPactState: false
  cuts:
    fetchTimeout: 30000000
  p2p:
    peer:
      hostaddress:
        hostname: 193.122.85.1
        port: 1789
      interface: '*4'
    ignoreBootstrapNodes: true
    peers:
      - address: {hostname: fr-1.chainweb-community.org, port: 443}
        id: null
      - address: {hostname: nl-1.chainweb-community.org, port: 443}
        id: null
      - address: {hostname: pl-1.chainweb-community.org, port: 443}
        id: null
      - address: {hostname: pl-2.chainweb-community.org, port: 443}
        id: null
      - address: {hostname: ca-1.chainweb-community.org, port: 443}
        id: null
    private: false
  serviceApi:
    interface: '127.0.0.1'
    port: 1848
  mining:
    coordination:
      enabled: false
    nodeMining:
      enabled: false
logging:
  logger:
    log_level: warn
  backend:
    color: auto
    format: text
    handle: stdout
